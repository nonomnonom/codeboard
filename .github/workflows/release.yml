name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIA_CANVAS_THREADS: '2'
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          const headings = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          assert(headings.some(line => line === `## ${pkg.version}` || line.startsWith(`## [${pkg.version}] - `)), 'Missing changelog entry');
          NODE
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run test:media
      - run: npm run test:install
      - run: npm run test:studies:install
      - run: npm run website:build
      - run: npm run docs:bundle
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 3
  install:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SKIA_CANVAS_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: .preview/npm-release
      - name: Test the release tarball
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = (Get-ChildItem -LiteralPath .preview/npm-release -Filter '*.tgz').FullName
          npm install -g $archive
          $work = Join-Path $env:RUNNER_TEMP 'codeboard-release-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item scripts/package-smoke.mjs $work
          Set-Location $work
          npm install --no-audit --no-fund $archive
          node package-smoke.mjs
          npx --no-install codeboard --version
          $search = codeboard docs search ProductionTools.drawingNeighbors | ConvertFrom-Json
          if ($search.mode -ne 'symbol' -or $search.results[0].symbol -ne 'ProductionTools.drawingNeighbors') { throw 'Docs symbol lookup failed' }
          $page = codeboard docs read $search.results[0].id | ConvertFrom-Json
          if ($page.docsHash -ne $search.docsHash -or $page.content -notmatch 'skipBlank') { throw 'Docs read failed' }
          codeboard init
          codeboard run scene.mjs
          if (!(Test-Path output/first.png) -or !(Test-Path output/first.cboard)) { throw 'CLI did not produce artwork' }
  publish:
    needs: [validate, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@11
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: package
      - name: Publish to npm
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          npm publish ./*.tgz --access public --tag "$tag"
