name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      SKIA_CANVAS_THREADS: '2'
      FFMPEG_PATH: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert(readFileSync('CHANGELOG.md', 'utf8').includes(`## [${pkg.version}] - `), 'Missing changelog entry');
          NODE
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run test:install
      - run: npm pack --ignore-scripts
      - run: sha256sum *.tgz > SHA256SUMS
      - name: Publish npm through trusted publishing
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          npm install --global npm@11.21.0
          channel=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then channel=next; fi
          npm publish *.tgz --access public --tag "$channel"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS --verify-tag --title "Codeboard $GITHUB_REF_NAME" --generate-notes "${args[@]}"
