name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SKIA_CANVAS_THREADS: '2'
jobs:
  test:
    name: npm package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:install
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run test:media
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: error
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-mutation
          path: coverage/mutation/
          if-no-files-found: error
  source-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SKIA_CANVAS_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run demo:typecheck
      - run: npm run docs:bundle
      - name: Install the package built from this source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packed = npm pack --ignore-scripts --json | ConvertFrom-Json
          npm install -g (Join-Path (Get-Location) $packed[0].filename)
      - name: Run public sources outside the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'example-work'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item -Recurse examples $work
          Set-Location $work
          codeboard --version
          codeboard run examples/studies/src/cli/run.ts
          codeboard run examples/quickstart/src/cli/run.ts
          codeboard run examples/code-board-demo/src/study/main.ts
          codeboard run examples/code-board-demo/src/cli/revise.ts
          codeboard run examples/code-board-demo/src/cli/presentation.ts author
          codeboard run examples/lengkap/src/cli/run.ts
          codeboard run examples/lengkap/src/review/verify.ts
          codeboard run examples/last-light/src/cli/run.ts
          codeboard run examples/last-light/src/cli/revise.ts
  gate:
    if: always()
    needs: [test, movie, coverage, mutation, source-examples]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
          MOVIE_RESULT: ${{ needs.movie.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          EXAMPLES_RESULT: ${{ needs.source-examples.result }}
        shell: pwsh
        run: |
          foreach ($result in @($env:TEST_RESULT, $env:MOVIE_RESULT, $env:COVERAGE_RESULT, $env:MUTATION_RESULT, $env:EXAMPLES_RESULT)) {
            if ($result -ne 'success') { throw "Required job result: $result" }
          }
