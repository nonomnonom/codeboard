name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SKIA_CANVAS_THREADS: '2'
jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22.22.0'}
          - {os: windows-latest, node: '22.22.0'}
          - {os: macos-latest, node: '22.22.0'}
          - {os: ubuntu-latest, node: '24.x'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:install
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FFMPEG_PATH: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test -- test/movie.test.ts
  released-examples:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SKIA_CANVAS_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install -g codeboard-studio@0.2.1
      - name: Run public sources outside the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'example-work'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item -Recurse examples $work
          Expand-Archive -LiteralPath website/public/art/code-board-demo/launch-source.zip -DestinationPath $work
          Set-Location $work
          codeboard --version
          codeboard run examples/quickstart.mjs
          codeboard run examples/code-board-demo/main.mjs
          codeboard run examples/code-board-demo/revise.mjs
          codeboard run code-board-demo/src/run.ts author
          codeboard run examples/lengkap.ts
          codeboard run examples/lengkap/verify.ts
          codeboard run examples/last-light.ts
          codeboard run examples/revise-last-light.ts
  gate:
    if: always()
    needs: [test, movie, released-examples]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
          MOVIE_RESULT: ${{ needs.movie.result }}
          EXAMPLES_RESULT: ${{ needs.released-examples.result }}
        run: test "$TEST_RESULT" = success && test "$MOVIE_RESULT" = success && test "$EXAMPLES_RESULT" = success
