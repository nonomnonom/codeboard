name: Website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run website:build
      - name: Require published engine before deployment
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {setTimeout} from 'node:timers/promises';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const site = readFileSync('website/lib/shared.ts', 'utf8');
          assert(site.includes(`export const releaseVersion = "${version}";`), 'Website version differs');
          let response;
          for (let attempt = 0; attempt < 12; attempt++) {
            response = await fetch(`https://registry.npmjs.org/${name}/${version}`, {signal: AbortSignal.timeout(10000)});
            if (response.ok) break;
            assert(response.status === 404 || response.status === 429 || response.status >= 500,
              `Registry rejected the version check: HTTP ${response.status}`);
            if (attempt < 11) {
              console.log(`Waiting for engine ${version} in the registry (HTTP ${response.status})`);
              await setTimeout(15000);
            }
          }
          assert(response?.ok, `Engine ${version} is not available after waiting for registry propagation`);
          assert.equal((await response.json()).version, version);
          NODE
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        with:
          path: website/out
  deploy:
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: website-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
