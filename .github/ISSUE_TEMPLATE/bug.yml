name: Bug report
description: Report a reproducible drawing, storage, animation, or export problem.
body:
  - type: input
    id: version
    attributes:
      label: Codeboard version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and FFmpeg version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include runnable code and commands. Remove private assets and credentials.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: For rendering defects, attach the affected frame and describe the difference.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
